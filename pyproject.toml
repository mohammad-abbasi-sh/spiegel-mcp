[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiegel-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for spiegel.de — headlines, 13 sections, search, videos & article text via the official RSS feeds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
spiegel-mcp = "spiegel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spiegel_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real spiegel.de site"]
